[project]
name = "a-maze-ing"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.3",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
exclude = ['\.venv/', 'build/', 'dist/']